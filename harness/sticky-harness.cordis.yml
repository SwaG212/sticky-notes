# Restricted Windows coding-agent composition for the sticky-notes card.
# stdout is reserved for the SDK JSON-RPC transport.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: !!js "process.env.DSH_REASONING_EFFORT === 'off' ? 'disabled' : 'enabled'"
    reasoningEffort: !!js process.env.DSH_REASONING_EFFORT ?? 'high'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

# The SDK transport cannot answer approval requests yet. The task-level
# confirmation lives in the Electron host; the sandbox remains enforced here.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: >-
      You are a concise coding agent running inside a desktop utility. Work only
      inside {{cwd}}, verify material changes, and report the result factually.
    workspaceContext:
      maxBytes: 65536
    toolBash: false
    toolJobs: false
    skills:
      enabled: false

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: !!js process.env.DSH_AGENT_MODE === 'minimal'

- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  disabled: !!js process.env.DSH_AGENT_MODE !== 'minimal'
  config:
    maxOutputChars: 16000

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  disabled: !!js process.env.DSH_AGENT_MODE === 'minimal'
  config:
    allowParallelInProgress: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none
