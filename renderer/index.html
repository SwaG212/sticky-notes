<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>便利贴</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <div class="pages-container">
    <!-- 主页面（任务管理） -->
    <div class="page page-main">
      <!-- 任务清单区 -->
      <div id="task-list">
        <div id="task-empty" class="empty-state">
          <div class="empty-icon">📋</div>
          <div class="empty-title">还没有任务</div>
          <div class="empty-desc">在下方输入想做的事，然后点击「整理」</div>
        </div>
        <div id="task-items"></div>
      </div>

      <!-- 分隔线 -->
      <div class="divider"></div>

      <!-- 项目页签栏 -->
      <div id="sheet-bar"></div>

      <!-- 输入区 -->
      <div id="input-area">
        <div id="image-previews"></div>
        <textarea id="text-input" placeholder="记录想做的事..." rows="1"></textarea>
        <div id="input-actions">
          <span class="daily-report-group">
            <button id="btn-daily-report">日报</button>
            <span id="daily-report-hint" class="daily-report-hint"></span>
          </span>
          <span class="input-buttons">
            <button id="btn-organize" disabled>整理 ▸</button>
            <button id="btn-switch-notepad">→</button>
          </span>
        </div>
      </div>
    </div>

    <!-- 记事本页面 -->
    <div class="page page-notepad">
      <div class="drag-handle"></div>
      <button id="btn-settings" title="设置">⚙</button>
      <div class="notepad-toolbar">
        <button id="btn-note-list">☰</button>
        <button id="btn-note-new">+</button>
      </div>
      <div id="notepad-textarea" contenteditable="true" data-placeholder="记录笔记..."></div>
      <div class="notepad-footer">
        <button id="btn-notepad-back">←</button>
        <div id="note-search-bar" class="hidden">
          <span id="note-search-status"></span>
          <input type="text" id="note-search-input" placeholder="搜索笔记...">
        </div>
        <button id="btn-notepad-forward" title="工具箱">→</button>
      </div>
      <div id="note-list-overlay" class="hidden">
        <div id="note-list-search-box">
          <input type="text" id="note-list-search" placeholder="搜索文件名...">
          <div class="search-mode-toggle" id="search-mode-toggle">
            <span class="toggle-thumb"></span>
            <span class="toggle-label toggle-filename active">文件</span>
            <span class="toggle-label toggle-content">内容</span>
          </div>
        </div>
        <div id="note-list-items"></div>
      </div>
    </div>

    <!-- 工具箱页面（第三页） -->
    <div class="page page-tools">
      <div class="drag-handle"></div>
      <div id="tools-cards"></div>
      <div class="notepad-footer">
        <button id="btn-tools-back">←</button>
      </div>
    </div>
  </div>

  <!-- 设置页面遮罩 -->
  <div id="settings-overlay" class="hidden">
    <div id="settings-dialog">
      <div class="settings-header">
        <button id="btn-settings-back">← 返回</button>
        <span class="settings-title">设置</span>
        <button id="btn-settings-confirm">确认</button>
      </div>
      <div class="settings-body">
        <div class="settings-card">
          <div class="settings-card-title">通用</div>
          <div class="settings-checkbox-row">
            <label class="checkbox-label">
              <input type="checkbox" id="settings-autostart">
              <span>开机自启</span>
            </label>
          </div>
          <div class="settings-checkbox-row">
            <label class="checkbox-label">
              <input type="checkbox" id="settings-winfixed">
              <span>固定到右下角</span>
            </label>
          </div>
          <label>文件存储位置</label>
          <div class="notesdir-combo">
            <input type="text" id="settings-notesdir" placeholder="如 D:\我的笔记">
            <button type="button" id="notesdir-dropdown-btn" class="combo-arrow" tabindex="-1">&#9660;</button>
            <div class="combo-dropdown hidden" id="notesdir-dropdown"></div>
          </div>
        </div>
        <div class="settings-card">
          <div class="settings-card-title">个人化</div>
          <label>日报姓名</label>
          <input type="text" id="settings-reportname" placeholder="输入姓名，用于日报">
          <label>项目名称</label>
          <div id="project-tags-input" class="project-tags-input" tabindex="0">
            <div id="project-tags-list"></div>
            <input type="text" id="project-tags-text" placeholder="输入后按 Enter 添加">
          </div>
        </div>
        <div class="settings-card">
          <div class="settings-card-title">页面</div>
          <div class="settings-checkbox-row">
            <label class="checkbox-label">
              <input type="checkbox" id="settings-tasks-page">
              <span>任务管理页</span>
            </label>
          </div>
          <div class="settings-checkbox-row">
            <label class="checkbox-label">
              <input type="checkbox" id="settings-tools-page">
              <span>工具箱页</span>
            </label>
          </div>
          <div class="settings-hint">关闭后重启生效</div>
        </div>
        <div class="settings-card">
          <div class="settings-card-title">API</div>
          <label>API Key</label>
          <input type="password" id="settings-apikey" placeholder="sk-xxxxxxxxxxxxxxxxxxxx">
          <label>API 地址（默认 DeepSeek）</label>
          <input type="text" id="settings-baseurl" placeholder="https://api.deepseek.com">
        </div>
        <div class="settings-card">
          <div class="settings-card-title">快捷键</div>
          <div class="shortcut-row">
            <span class="shortcut-label">唤出/隐藏</span>
            <span class="shortcut-kbd" id="shortcut-toggle" tabindex="0"></span>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-label">整理</span>
            <span class="shortcut-kbd" id="shortcut-organize" tabindex="0"></span>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-label">切换任务页</span>
            <span class="shortcut-kbd" id="shortcut-switchTask" tabindex="0"></span>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-label">切换笔记页</span>
            <span class="shortcut-kbd" id="shortcut-switchNotepad" tabindex="0"></span>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-label">切换工具箱页</span>
            <span class="shortcut-kbd" id="shortcut-switchTools" tabindex="0"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 整理中提示 -->
  <div id="processing-overlay" class="hidden">
    <div class="spinner"></div>
    <div id="processing-text">AI 整理中...</div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
